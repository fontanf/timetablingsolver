name: WebAssembly

# Builds the WebAssembly module and the web page, runs their tests, and
# deploys the page and the API of the polls (Pages Functions, see
# 'wasm/server/api.js') to Cloudflare Pages on every push to main. Only the
# latest commit of main is deployed.
#
# Pull requests touching the module, the page or the library only build and
# test them.
#
# Deployment requires the repository secrets CLOUDFLARE_API_TOKEN (permission
# "Cloudflare Pages: Edit") and CLOUDFLARE_ACCOUNT_ID, and an existing
# Cloudflare Pages project (direct upload) named after the repository variable
# CLOUDFLARE_PAGES_PROJECT, "timetablingsolver" by default. The API of the
# polls requires a D1 database bound to the project as "DB" (in the settings
# of the project on Cloudflare).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "wasm/**"
      - "src/**"
      - "include/**"
      - "extern/**"
      - "CMakeLists.txt"
      - ".github/workflows/wasm.yml"
  workflow_dispatch:

# Cancel the run of a pull request when a new commit is pushed to it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  EMSCRIPTEN_VERSION: "6.0.11"

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: Set up Emscripten
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: ${{ env.EMSCRIPTEN_VERSION }}
        actions-cache-folder: emsdk-cache
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        # 'node:sqlite', for the tests of the API.
        node-version: 24
    - name: Build the WebAssembly module
      run: |
        emcmake cmake -S . -B build_wasm -DCMAKE_BUILD_TYPE=Release -DTIMETABLINGSOLVER_BUILD_WASM=ON
        cmake --build build_wasm --target TimetablingSolver_wasm --parallel 4
    - name: Run the tests
      run: node --test wasm/tests/*.test.js wasm/tests/*.test.mjs
    # 'pages/site': the static files; 'pages/functions': the Pages Functions,
    # which import 'pages/server'.
    - name: Assemble the site
      run: |
        mkdir -p pages/site
        cp -r wasm/web/. pages/site/
        rm pages/site/serve.py pages/site/package.json
        cp build_wasm/wasm/timetablingsolver.js build_wasm/wasm/timetablingsolver.wasm pages/site/
        cp wasm/js/timetablingsolver_worker.js pages/site/
        cp -r wasm/functions wasm/server pages/
        ls -lR pages
    - name: Upload the site
      uses: actions/upload-artifact@v4
      with:
        name: pages
        path: pages
        if-no-files-found: error

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages
    # One deployment at a time.
    concurrency:
      group: cloudflare-pages-deploy
      cancel-in-progress: false
    steps:
    # main may have moved during the build: only its head is deployed.
    - name: Check that the commit is still the head of main
      id: check
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        head=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
        if [ "$head" = "${{ github.sha }}" ]; then
          echo "latest=true" >> "$GITHUB_OUTPUT"
        else
          echo "latest=false" >> "$GITHUB_OUTPUT"
          echo "::notice::${{ github.sha }} is no longer the head of main ($head): not deployed."
        fi
    - name: Download the site
      if: steps.check.outputs.latest == 'true'
      uses: actions/download-artifact@v5
      with:
        name: pages
        path: pages
    - name: Deploy to Cloudflare Pages
      if: steps.check.outputs.latest == 'true'
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # The functions are found in 'functions/' of the working directory.
        workingDirectory: pages
        command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'timetablingsolver' }} --branch=main --commit-hash=${{ github.sha }}
